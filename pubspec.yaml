name: kisan_vaani
description: AI-powered Hindi voice assistant for farmers

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0
  
  # Voice Assistant
  speech_to_text: ^7.0.0
  flutter_tts: ^4.0.0
  
  # Networking & Data
  http: ^1.1.0
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  
  # Translation & Localization
  translator: ^1.0.3+1
  
  # Core Math & Utilities
  vector_math: ^2.1.4
  characters: ^1.3.0
   
  # Media & Location
  image_picker: ^1.0.4
  geolocator: ^10.1.0
  permission_handler: ^11.0.1
  
  # Weather
  weather: ^3.1.1
  
  # Charts & Animations
  fl_chart: ^0.65.0
  shimmer: ^3.0.0
  animations: ^2.0.8
  
  # State Management
  provider: ^6.1.1
  
  # UI Components
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  flutter_animate: ^4.3.0
  
  # PDF and Documents
  pdf: ^3.10.7
  path_provider: ^2.1.1
  path: ^1.8.3
  
  # Web scraping and notifications
  html: ^0.15.4
  flutter_local_notifications: ^17.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true
  
  assets:
    - assets/images/
    - assets/icons/
    - assets/sounds/
    - assets/locales/en/
    - assets/locales/hi/
    - assets/locales/gu/
    - assets/locales/ta/
    
  fonts:
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari-Regular.ttf
        - asset: fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
